[project]
license = { text = "Apache-2.0" }
authors = [
  { name = "Cloud-Dog, Viewdeck Engineering Limited" }
]
name = "cloud_dog_db"
version = "0.3.2"
description = "PS-DB platform database foundation package for Cloud-Dog services (SQL + NoSQL/search/wide-column/vector/time-series + source connectors)"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
mongodb = ["pymongo>=4.6,<5.0"]
couchdb = ["CouchDB>=1.2,<2.0", "requests>=2.31"]
couchbase = ["couchbase>=4.1,<5.0"]
opensearch = ["opensearch-py>=2.4,<4.0"]
elasticsearch = ["elasticsearch>=8.0,<9.0"]
cassandra = ["cassandra-driver>=3.28,<4.0"]
sql = ["psycopg[binary]>=3.2", "PyMySQL>=1.1"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.2"]
nosql = [
    "pymongo>=4.6,<5.0",
    "CouchDB>=1.2,<2.0",
    "requests>=2.31",
    "couchbase>=4.1,<5.0",
    "opensearch-py>=2.4,<4.0",
    "elasticsearch>=8.0,<9.0",
    "cassandra-driver>=3.28,<4.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "aiosqlite>=0.20",
    "PyMySQL>=1.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.2",
    "pymongo>=4.6,<5.0",
    "CouchDB>=1.2,<2.0",
    "opensearch-py>=2.4,<4.0",
    "elasticsearch>=8.0,<9.0",
    "cassandra-driver>=3.28,<4.0",
    "build>=1.2",
]

[project.scripts]
cloud-dog-db-migrate = "cloud_dog_db.migrations.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloud_dog_db"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[project.urls]
"Source" = "https://github.com/cloud-dog-ai/platform-db"
